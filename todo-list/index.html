<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <title>TODO-LIST</title>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="styles.css"></link>
    </head>

    <body>
        <div class="header"></div>
        <div class="center-section">
            <div class="center-task">
                <div class="center-task-topbar">
                    <div id="center-section-display">Overview</div>
                    <div class="topbar-actions">
                        <button class="add-task-button" type="button">
                            <span class="add-task-icon" aria-hidden="true">+</span>
                            <span>Add task</span>
                        </button>
                        <div class="overview-sort-control">
                            <button class="sort-button" type="button" aria-label="Sort saved tasks: Recent" aria-expanded="false" aria-haspopup="true">
                                ↕ Recent
                            </button>
                            <div class="sort-menu" aria-label="Sort saved tasks">
                                <button class="sort-option" type="button" data-sort="recent">Recent</button>
                                <button class="sort-option" type="button" data-sort="priority-low-high">
                                    Priority low → high
                                </button>
                                <button class="sort-option" type="button" data-sort="priority-high-low">
                                    Priority high → low
                                </button>
                            </div>
                        </div>
                        <div class="overview-filter-control">
                            <button class="filter-button" type="button" aria-expanded="false" aria-haspopup="true">
                                Filter
                            </button>
                            <div class="filter-menu" aria-label="Filter saved tasks by priority">
                                <label class="filter-option filter-option-1">
                                    <input type="checkbox" value="1" checked>
                                    <span>Priority 1</span>
                                </label>
                                <label class="filter-option filter-option-2">
                                    <input type="checkbox" value="2" checked>
                                    <span>Priority 2</span>
                                </label>
                                <label class="filter-option filter-option-3">
                                    <input type="checkbox" value="3" checked>
                                    <span>Priority 3</span>
                                </label>
                                <label class="filter-option filter-option-4">
                                    <input type="checkbox" value="4" checked>
                                    <span>Priority 4</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="center-task-content"></div>
                <p class="empty-task-message">No current tasks</p>
                <div class="center-task-saved">
                    <div class="saved-tasks-heading">Saved Tasks</div>
                    <p class="empty-saved-task-message">No current tasks</p>
                    <div class="saved-task-list"></div>
                </div>
            </div>
            <div class="sidebar"></div>
        </div>
        <div class="footer"></div>
    </body>
</html>
